      <stop offset="0%" stop-color="#071118" />
      <stop offset="55%" stop-color="#0b1f28" />
      <stop offset="100%" stop-color="#063730" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
