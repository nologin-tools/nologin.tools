name: Catalog Health Checks

on:
  schedule:
    # Twice daily at UTC 01:00 and 13:00 (Beijing 09:00 / 21:00) so every approved
    # tool always has an observation inside the 48h effective-status window.
    - cron: '0 1,13 * * *'
  workflow_dispatch:
    inputs:
      status:
        description: 'Tool status to check'
        required: false
        type: choice
        options: [approved, pending]
        default: approved

concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Run health checks
        run: node scripts/run-health-checks.mjs --status "${{ inputs.status || 'approved' }}" --report reports/tmp/health.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-report
          path: reports/tmp/health.json
          retention-days: 14
