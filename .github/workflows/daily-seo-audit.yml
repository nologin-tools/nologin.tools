name: Daily SEO Audit & IndexNow

on:
  schedule:
    # Runs daily at UTC 03:00 (Beijing 11:00)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      skip_indexnow:
        description: 'Skip IndexNow submission'
        required: false
        type: boolean
        default: false

concurrency:
  group: daily-seo-audit
  cancel-in-progress: true

jobs:
  seo-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Fetch build data from D1
        run: node scripts/fetch-build-data.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        continue-on-error: true

      - name: Build static site
        run: pnpm build

      - name: Run Daily Technical SEO & Crawl Audit
        id: audit
        run: node scripts/daily-seo-audit.mjs

      - name: Submit URLs to IndexNow
        if: success() && (github.event.inputs.skip_indexnow != 'true')
        run: node scripts/push-indexnow.mjs
        continue-on-error: true

      - name: Create Alert Issue on Failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.PAT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list --label "seo-alert" --state open --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -z "$EXISTING" ]; then
            gh issue create \
              --title "🚨 SEO Alert: Daily Technical SEO Audit Failed" \
              --body "The daily technical SEO audit encountered broken pages, invalid canonicals, missing meta tags, or broken Schema.org JSON-LD markup. Please inspect the latest workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --label "seo-alert"
          else
            gh issue comment "$EXISTING" \
              --body "The daily technical SEO audit continues to fail in run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
